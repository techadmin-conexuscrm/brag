<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../shared/base.css">
<script src="out/timeline.js"></script>
<style>
  .icons{position:absolute;left:0;right:0;top:1060px;display:flex;justify-content:center;gap:34px}
  .ic{width:150px;text-align:center;color:#fff;font-size:21px;font-weight:600;line-height:1.25}
  .ic .sq{width:96px;height:96px;margin:0 auto 14px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(8,16,70,.22)}
  .ic svg{width:48px;height:48px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ic .gt{font-size:26px;font-weight:800;color:var(--navy)}
  .cta{position:absolute;left:50%;top:1330px;background:#fff;color:var(--navy);border-radius:18px;height:96px;padding:0 54px;display:flex;align-items:center;font-size:38px;font-weight:700;box-shadow:0 14px 34px rgba(8,16,70,.28);white-space:nowrap}
  .url{position:absolute;left:0;right:0;top:1450px;text-align:center;color:#fff;font-size:34px;font-weight:600;letter-spacing:.02em}
</style>
</head>
<body>
<section class="scene bg-blue" id="A">
  <div class="ring" id="Ar1" style="width:760px;height:760px;top:800px"></div>
  <div class="ring" id="Ar2" style="width:1080px;height:1080px;top:800px"></div>
  <div class="ring" id="Ar3" style="width:1400px;height:1400px;top:800px"></div>
  <div class="dot" style="width:110px;height:110px;background:var(--navy);right:110px;top:560px"></div>
  <div class="dot" style="width:22px;height:22px;background:#fff;left:120px;top:690px"></div>
  <div class="logo" id="Alogo" style="top:700px;width:860px"><img src="../../shared/assets/logo-reversed-white.png" alt=""></div>
  <div class="lsub" id="At" style="top:870px;font-size:52px;font-weight:700">Built for call teams.</div>
  <div class="lsub" id="As" style="top:950px;font-size:34px;font-weight:500;color:#D7F6FD">Calls, chat, QA and payments on one screen.</div>
  <div class="icons" id="Ai">
    <div class="ic"><div class="sq"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>Team chat</div>
    <div class="ic"><div class="sq"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg></div>Payments</div>
    <div class="ic"><div class="sq"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>Built-in dialer</div>
    <div class="ic"><div class="sq"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></div>Live leaderboard</div>
    <div class="ic"><div class="sq"><svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></div>AI call QA</div>
  </div>
  
  <div class="cta" id="Acta">Book a demo</div>
  <div class="url" id="Aurl">tryconexus.com</div>
</section>
<div id="cap"></div>
<script>window.CHAPTER_IS_FINAL = true;</script>
<script src="../../shared/runtime.js"></script>
<script>
window.renderChapter = function (t) {
  const gp = easeInOut(prog(t, 0.15, 0.8));
  $('Alogo').style.clipPath = `inset(0 ${100 - gp * 100}% 0 0)`;
  rings(t, ['Ar1','Ar2','Ar3'], 0);
  enter($('At'), t, wt('l2', 'meet'), 0.45, 24);
  enter($('As'), t, wt('l1', 'your'), 0.45, 24);
  [...$('Ai').children].forEach((c, i) => enter(c, t, wt('l2', 'built') + 0.4 + i * 0.1, 0.4, 30));
  const bk = wt('l3', 'book'); const cp = easeOut(prog(t, bk, 0.45));
  $('Acta').style.opacity = cp; $('Acta').style.transform = `translateX(-50%) scale(${0.85 + 0.15 * backOut(prog(t, bk, 0.45))})`;
  enter($('Aurl'), t, wt('l3', 'tryconexus'), 0.4, 16);
};
</script>
</body>
</html>
